[project]
name = "horae"
version = "0.1.0"
description = "Horae — Pure functional scheduler core. No I/O, no network, no system clock."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["horae", "scheduler_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
